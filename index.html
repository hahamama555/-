<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>自由マークつけツール</title>

<style>

/* =========================
   基本
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #111;
  color: white;
  font-family: sans-serif;
}


/* =========================
   操作バー
========================= */

.toolbar {

  position: sticky;
  top: 0;
  z-index: 100;

  display: flex;

  gap: 8px;

  align-items: center;
  justify-content: center;

  flex-wrap: wrap;

  padding: 8px;

  background: #222;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.5);
}


/* =========================
   ボタン
========================= */

button,
.fileBtn {

  border: none;

  border-radius: 10px;

  padding: 10px 14px;

  font-size: 15px;

  font-weight: bold;

  color: #111;

  background: white;

  cursor: pointer;

  user-select: none;
}


button:active,
.fileBtn:active {

  transform: scale(0.96);

}


/* 画像変更 */

.fileBtn {

  display: inline-flex;

  align-items: center;

  justify-content: center;
}


.fileBtn input {

  display: none;

}


/* =========================
   マーク入力
========================= */

.mark-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;
}


/*
  2行入力できるように
  input → textarea に変更
*/

#markInput {

  width: 130px;

  min-height: 58px;

  max-height: 100px;

  resize: vertical;

  border: none;

  border-radius: 8px;

  padding: 6px 8px;

  font-size: 20px;

  line-height: 1.2;

  text-align: center;

  background: white;

  color: #111;

  font-family: sans-serif;
}


/* =========================
   マーク色
========================= */

.color-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;
}


#markColor {

  width: 45px;

  height: 38px;

  border: none;

  border-radius: 8px;

  padding: 2px;

  background: white;

  cursor: pointer;
}


/* =========================
   サイズ変更
========================= */

.size-control {

  display: flex;

  align-items: center;

  gap: 6px;

  font-size: 13px;

  color: white;
}


#markSize {

  width: 100px;

  min-width: 100px;
}


#sizeValue {

  min-width: 45px;

  text-align: center;
}


/* =========================
   消しゴム
========================= */

#eraseMode {

  background: #ffdddd;

  color: #b00000;
}


#eraseMode.active {

  background: #ff3333;

  color: white;

  box-shadow:
    0 0 8px rgba(255,0,0,0.7);
}


/* =========================
   画像エリア
========================= */

#board {

  position: relative;

  width: min(100vw, 1024px);

  margin: 0 auto;

  line-height: 0;

  touch-action: manipulation;

  user-select: none;

  overflow: hidden;
}


#board img {

  display: block;

  width: 100%;

  height: auto;

  pointer-events: none;
}


/* =========================
   自由マーク
========================= */

.mark {

  position: absolute;

  transform: translate(-50%, -50%);

  display: flex;

  align-items: center;

  justify-content: center;

  /*
    2行対応
  */

  white-space: pre-line;

  text-align: center;

  line-height: 1.05;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans",
    sans-serif;

  font-weight: 900;

  /*
    既存マークをタップできるようにする
  */

  pointer-events: auto;

  user-select: none;

  cursor: pointer;

  /*
    タップ範囲を少し広げる
  */

  padding: 3px;

  /*
    文字が画像からはみ出しにくくする
  */

  max-width: 90%;

  overflow-wrap: anywhere;

  text-shadow:
    1px 1px 2px rgba(0,0,0,0.35);
}


/* =========================
   上書き中の表示
========================= */

.mark.overwrite-target {

  outline: 3px dashed #ffff00;

  outline-offset: 2px;
}


/* =========================
   説明
========================= */

.help {

  width: min(100vw, 1024px);

  margin: 0 auto;

  padding: 8px 12px;

  background: #181818;

  color: #ddd;

  font-size: 13px;

  line-height: 1.5;

  text-align: center;
}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  .toolbar {

    gap: 6px;

    padding: 6px;
  }


  button,
  .fileBtn {

    padding: 8px 10px;

    font-size: 13px;
  }


  .mark-control,
  .color-control,
  .size-control {

    font-size: 12px;
  }


  #markInput {

    width: 110px;

    min-height: 54px;

    font-size: 18px;
  }


  #markColor {

    width: 40px;

    height: 36px;
  }


  #markSize {

    width: 85px;

    min-width: 85px;
  }


  .help {

    font-size: 12px;

    padding: 6px;
  }

}

</style>

</head>


<body>


<!-- =========================
     操作バー
========================= -->

<div class="toolbar">


  <!-- 画像変更 -->

  <label class="fileBtn">

    🖼️ 画像を変更

    <input
      id="imageFile"
      type="file"
      accept="image/*"
    >

  </label>


  <!-- マーク入力 -->

  <div class="mark-control">

    ✏️ マーク

    <textarea
      id="markInput"
      maxlength="30"
      placeholder="例：⭕️&#10;名前"
    >⭕️</textarea>

  </div>


  <!-- 色 -->

  <div class="color-control">

    🎨 色

    <input
      id="markColor"
      type="color"
      value="#ff0000"
    >

  </div>


  <!-- サイズ -->

  <div class="size-control">

    📏 サイズ

    <input
      type="range"
      id="markSize"
      min="8"
      max="150"
      value="40"
    >

    <span id="sizeValue">
      40px
    </span>

  </div>


  <!-- 消しゴム -->

  <button id="eraseMode">

    🧹 消しゴム

  </button>


  <!-- 1つ戻す -->

  <button id="undo">

    ↩ 1つ戻す

  </button>


  <!-- 全部消す -->

  <button id="clear">

    🗑️ 全部消す

  </button>


</div>


<!-- =========================
     操作説明
========================= -->

<div class="help">

  画像をタップ → マークを追加　
  ／　
  置いたマークをタップ → 入力中の内容で上書き　
  ／　
  「消しゴム」→ マークをタップして削除

</div>


<!-- =========================
     画像
========================= -->

<div id="board">

  <img
    id="base"
    src="https://picsum.photos/800/1000"
    alt="タップしてマークを付ける画像"
  >

</div>



<script>

/* =========================
   要素
========================= */

const board =
  document.getElementById("board");

const base =
  document.getElementById("base");

const imageFile =
  document.getElementById("imageFile");

const markInput =
  document.getElementById("markInput");

const markColor =
  document.getElementById("markColor");

const markSize =
  document.getElementById("markSize");

const sizeValue =
  document.getElementById("sizeValue");

const eraseMode =
  document.getElementById("eraseMode");

const undo =
  document.getElementById("undo");

const clear =
  document.getElementById("clear");


/* =========================
   マーク一覧
========================= */

let marks = [];


/* =========================
   消しゴムモード
========================= */

let isEraseMode = false;


/* =========================
   マーク文字を取得
========================= */

function getMarkText() {

  let text =
    markInput.value;

  /*
    完全に空欄の場合
    ⭕️に戻す
  */

  if (text.trim() === "") {

    text = "⭕️";

  }

  return text;
}


/* =========================
   マークを作成
========================= */

function createMark(x, y) {

  const mark =
    document.createElement("div");


  mark.className =
    "mark";


  /*
    textareaの改行を
    そのまま表示する
  */

  mark.textContent =
    getMarkText();


  mark.style.left =
    x + "px";


  mark.style.top =
    y + "px";


  mark.style.fontSize =
    markSize.value + "px";


  mark.style.color =
    markColor.value;


  /*
    マーク自身をタップした時
  */

  mark.addEventListener(
    "pointerup",
    function(e) {

      e.stopPropagation();


      /*
        消しゴムモード
      */

      if (isEraseMode) {

        removeMark(mark);

        return;

      }


      /*
        通常モードなら
        現在入力している内容で
        上書き
      */

      overwriteMark(mark);

    }
  );


  board.appendChild(mark);


  marks.push(mark);

}


/* =========================
   マーク追加
========================= */

function addMark(clientX, clientY) {

  const rect =
    board.getBoundingClientRect();


  const x =
    clientX - rect.left;


  const y =
    clientY - rect.top;


  createMark(x, y);

}


/* =========================
   マーク上書き
========================= */

function overwriteMark(mark) {

  /*
    現在の入力内容に変更
  */

  mark.textContent =
    getMarkText();


  /*
    色も現在の色に変更
  */

  mark.style.color =
    markColor.value;


  /*
    サイズも現在のサイズに変更
  */

  mark.style.fontSize =
    markSize.value + "px";


  /*
    一瞬だけ黄色い枠を表示
  */

  mark.classList.add(
    "overwrite-target"
  );


  setTimeout(
    function() {

      mark.classList.remove(
        "overwrite-target"
      );

    },
    300
  );

}


/* =========================
   マーク削除
========================= */

function removeMark(mark) {

  const index =
    marks.indexOf(mark);


  if (index !== -1) {

    marks.splice(index, 1);

  }


  mark.remove();

}


/* =========================
   画像タップ
========================= */

board.addEventListener(
  "pointerup",
  function(e) {

    /*
      マークをタップした場合は
      マーク側で処理するので
      ここでは何もしない
    */

    if (
      e.target.classList.contains("mark")
    ) {

      return;

    }


    /*
      画像以外は無視
    */

    if (
      e.target !== board &&
      e.target !== base
    ) {

      return;

    }


    /*
      消しゴムモード中は
      空白部分をタップしても
      何もしない
    */

    if (isEraseMode) {

      return;

    }


    addMark(
      e.clientX,
      e.clientY
    );

  }
);


/* =========================
   サイズ変更
========================= */

markSize.addEventListener(
  "input",
  function() {

    const size =
      Number(this.value);


    sizeValue.textContent =
      size + "px";


    /*
      すでに置いたマークも
      サイズ変更
    */

    marks.forEach(
      function(mark) {

        mark.style.fontSize =
          size + "px";

      }
    );

  }
);


/* =========================
   色変更
========================= */

markColor.addEventListener(
  "input",
  function() {

    const color =
      this.value;


    /*
      すでに置いたマークも
      色変更
    */

    marks.forEach(
      function(mark) {

        mark.style.color =
          color;

      }
    );

  }
);


/* =========================
   マーク入力
========================= */

markInput.addEventListener(
  "input",
  function() {

    /*
      新しく追加するマーク、
      または既存マークを
      上書きするときに使用。

      既存マークはここでは
      自動変更しません。
    */

  }
);


/* =========================
   消しゴムボタン
========================= */

eraseMode.addEventListener(
  "click",
  function() {

    isEraseMode =
      !isEraseMode;


    if (isEraseMode) {

      eraseMode.textContent =
        "🧹 消しゴムON";

      eraseMode.classList.add(
        "active"
      );

      board.style.cursor =
        "crosshair";

    }
    else {

      eraseMode.textContent =
        "🧹 消しゴム";

      eraseMode.classList.remove(
        "active"
      );

      board.style.cursor =
        "default";

    }

  }
);


/* =========================
   画像変更
========================= */

imageFile.addEventListener(
  "change",
  function(e) {

    const file =
      e.target.files[0];


    if (!file) {

      return;

    }


    const url =
      URL.createObjectURL(file);


    base.onload =
      function() {

        URL.revokeObjectURL(url);

      };


    base.src =
      url;


    /*
      画像を変更したら
      マークを全部削除
    */

    marks.forEach(
      function(mark) {

        mark.remove();

      }
    );


    marks = [];

  }
);


/* =========================
   1つ戻す
========================= */

undo.addEventListener(
  "click",
  function() {

    const mark =
      marks.pop();


    if (mark) {

      mark.remove();

    }

  }
);


/* =========================
   全部消す
========================= */

clear.addEventListener(
  "click",
  function() {

    marks.forEach(
      function(mark) {

        mark.remove();

      }
    );


    marks = [];

  }
);

</script>

</body>
</html>
