<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>自由マークつけツール</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: sans-serif;
}


/* =========================
   操作バー
========================= */

.toolbar {

  position: sticky;
  top: 0;
  z-index: 10;

  display: flex;
  gap: 8px;

  align-items: center;
  justify-content: center;

  flex-wrap: wrap;

  padding: 8px;

  background: #222;
}


/* =========================
   ボタン
========================= */

button,
.fileBtn {

  border: none;

  border-radius: 10px;

  padding: 10px 14px;

  font-size: 15px;
  font-weight: bold;

  color: #111;
  background: white;

  cursor: pointer;
}


.fileBtn input {
  display: none;
}


/* =========================
   マーク入力
========================= */

.mark-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;
}


#markInput {

  width: 85px;

  height: 38px;

  border: none;

  border-radius: 8px;

  padding: 5px 8px;

  font-size: 22px;

  text-align: center;

  background: white;

  color: #111;
}


/* =========================
   マーク色
========================= */

.color-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;
}


#markColor {

  width: 45px;
  height: 38px;

  border: none;

  border-radius: 8px;

  padding: 2px;

  background: white;

  cursor: pointer;
}


/* =========================
   サイズ変更
========================= */

.size-control {

  display: flex;

  align-items: center;

  gap: 6px;

  font-size: 13px;

  color: white;
}


#markSize {

  width: 100px;

  /*
    最小8px
    最大150px
  */

  min-width: 100px;
}


#sizeValue {

  min-width: 45px;

  text-align: center;
}


/* =========================
   画像
========================= */

#board {

  position: relative;

  width: min(100vw, 1024px);

  margin: 0 auto;

  line-height: 0;

  touch-action: manipulation;

  user-select: none;
}


#board img {

  display: block;

  width: 100%;

  height: auto;

  pointer-events: none;
}


/* =========================
   自由マーク
========================= */

.mark {

  position: absolute;

  transform: translate(-50%, -50%);

  display: flex;

  align-items: center;

  justify-content: center;

  white-space: nowrap;

  line-height: 1;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans",
    sans-serif;

  font-weight: 900;

  pointer-events: none;

  user-select: none;

  text-shadow:
    1px 1px 2px rgba(0,0,0,0.35);
}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  button,
  .fileBtn {

    padding: 9px 12px;

    font-size: 14px;
  }


  .mark-control,
  .color-control,
  .size-control {

    font-size: 12px;
  }


  #markInput {

    width: 70px;

    height: 36px;

    font-size: 20px;
  }


  #markColor {

    width: 40px;

    height: 36px;
  }


  #markSize {

    width: 90px;

    min-width: 90px;
  }

}

</style>
</head>


<body>


<!-- =========================
     操作バー
========================= -->

<div class="toolbar">


  <!-- 画像変更 -->

  <label class="fileBtn">

    🖼️ 画像を変更

    <input
      id="imageFile"
      type="file"
      accept="image/*"
    >

  </label>


  <!-- マーク入力 -->

  <div class="mark-control">

    ✏️ マーク

    <input
      id="markInput"
      type="text"
      value="⭕️"
      maxlength="10"
      placeholder="例：🍩"
    >

  </div>


  <!-- マーク色 -->

  <div class="color-control">

    🎨 色

    <input
      id="markColor"
      type="color"
      value="#ff0000"
    >

  </div>


  <!-- サイズ -->

  <div class="size-control">

    📏 サイズ

    <input
      type="range"
      id="markSize"
      min="8"
      max="150"
      value="40"
    >

    <span id="sizeValue">
      40px
    </span>

  </div>


  <!-- 1つ戻す -->

  <button id="undo">

    ↩ 1つ戻す

  </button>


  <!-- 全部消す -->

  <button id="clear">

    🗑️ 全部消す

  </button>


</div>



<!-- =========================
     画像
========================= -->

<div id="board">

  <img
    id="base"
    src="https://picsum.photos/800/1000"
    alt="タップしてマークを付ける画像"
  >

</div>



<script>


/* =========================
   要素
========================= */

const board =
  document.getElementById("board");

const base =
  document.getElementById("base");

const imageFile =
  document.getElementById("imageFile");

const markInput =
  document.getElementById("markInput");

const markColor =
  document.getElementById("markColor");

const markSize =
  document.getElementById("markSize");

const sizeValue =
  document.getElementById("sizeValue");

const undo =
  document.getElementById("undo");

const clear =
  document.getElementById("clear");


/* =========================
   マーク一覧
========================= */

let marks = [];


/* =========================
   マークを追加
========================= */

function addMark(clientX, clientY) {

  const rect =
    board.getBoundingClientRect();


  const x =
    clientX - rect.left;

  const y =
    clientY - rect.top;


  /* 入力されたマーク */

  let text =
    markInput.value;


  /* 空欄なら⭕️ */

  if (text.trim() === "") {

    text = "⭕️";

  }


  /* マーク作成 */

  const mark =
    document.createElement("div");


  mark.className =
    "mark";


  mark.textContent =
    text;


  mark.style.left =
    x + "px";


  mark.style.top =
    y + "px";


  mark.style.fontSize =
    markSize.value + "px";


  mark.style.color =
    markColor.value;


  board.appendChild(mark);


  marks.push(mark);

}



/* =========================
   画像タップ
========================= */

board.addEventListener(
  "pointerup",
  function(e) {

    if (
      e.target !== board &&
      e.target.id !== "base"
    ) {

      return;

    }


    addMark(
      e.clientX,
      e.clientY
    );

  }
);



/* =========================
   サイズ変更
========================= */

markSize.addEventListener(
  "input",
  function() {

    const size =
      Number(this.value);


    sizeValue.textContent =
      size + "px";


    /* すでに置いたマークも変更 */

    marks.forEach(
      function(mark) {

        mark.style.fontSize =
          size + "px";

      }
    );

  }
);



/* =========================
   色変更
========================= */

markColor.addEventListener(
  "input",
  function() {

    const color =
      this.value;


    /* すでに置いたマークも変更 */

    marks.forEach(
      function(mark) {

        mark.style.color =
          color;

      }
    );

  }
);



/* =========================
   マーク変更
========================= */

markInput.addEventListener(
  "input",
  function() {

    /*
      新しく置くマークから
      入力内容が反映されます。

      すでに置いたマークは
      そのまま残します。
    */

  }
);



/* =========================
   画像変更
========================= */

imageFile.addEventListener(
  "change",
  function(e) {

    const file =
      e.target.files[0];


    if (!file) return;


    const url =
      URL.createObjectURL(file);


    base.onload =
      function() {

        URL.revokeObjectURL(url);

      };


    base.src =
      url;


    /* 画像変更時は
       マークを全部消す */

    marks.forEach(
      function(mark) {

        mark.remove();

      }
    );


    marks = [];

  }
);



/* =========================
   1つ戻す
========================= */

undo.addEventListener(
  "click",
  function() {

    const mark =
      marks.pop();


    if (mark) {

      mark.remove();

    }

  }
);



/* =========================
   全部消す
========================= */

clear.addEventListener(
  "click",
  function() {

    marks.forEach(
      function(mark) {

        mark.remove();

      }
    );


    marks = [];

  }
);

</script>

</body>
</html>
