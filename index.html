<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>自由マークつけツール</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #111;
  color: white;
  font-family: sans-serif;
}


/* =========================
   操作バー
========================= */

.toolbar {

  position: sticky;
  top: 0;
  z-index: 100;

  display: flex;

  gap: 8px;

  align-items: center;
  justify-content: center;

  flex-wrap: wrap;

  padding: 8px;

  background: #222;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.5);
}


/* =========================
   ボタン
========================= */

button,
.fileBtn {

  border: none;

  border-radius: 10px;

  padding: 10px 14px;

  font-size: 15px;

  font-weight: bold;

  color: #111;

  background: white;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;
}

button:active,
.fileBtn:active {

  transform: scale(0.96);

}


.fileBtn {

  display: inline-flex;

  align-items: center;

  justify-content: center;

}

.fileBtn input {

  display: none;

}


/* =========================
   マーク入力
========================= */

.mark-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;

}


/* 2行入力対応 */

#markInput {

  width: 130px;

  min-height: 58px;

  max-height: 100px;

  resize: vertical;

  border: none;

  border-radius: 8px;

  padding: 6px 8px;

  font-size: 20px;

  line-height: 1.2;

  text-align: center;

  background: white;

  color: #111;

  font-family: sans-serif;

}


/* =========================
   色
========================= */

.color-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;

}


#markColor {

  width: 45px;

  height: 38px;

  border: none;

  border-radius: 8px;

  padding: 2px;

  background: white;

  cursor: pointer;

}


/* =========================
   サイズ
========================= */

.size-control {

  display: flex;

  align-items: center;

  gap: 6px;

  font-size: 13px;

  color: white;

}


#markSize {

  width: 100px;

  min-width: 100px;

}


#sizeValue {

  min-width: 45px;

  text-align: center;

}


/* =========================
   消しゴム
========================= */

#eraseMode {

  background: #ffdddd;

  color: #b00000;

}


#eraseMode.active {

  background: #ff3333;

  color: white;

  box-shadow:
    0 0 8px rgba(255,0,0,0.7);

}


/* =========================
   画像エリア
========================= */

#board {

  position: relative;

  width: min(100vw, 1024px);

  margin: 0 auto;

  line-height: 0;

  user-select: none;

  -webkit-user-select: none;

  overflow: hidden;

}


#board img {

  display: block;

  width: 100%;

  height: auto;

  pointer-events: none;

  user-select: none;

}


/* =========================
   自由マーク
========================= */

.mark {

  position: absolute;

  transform: translate(-50%, -50%);

  display: flex;

  align-items: center;

  justify-content: center;

  white-space: pre-line;

  text-align: center;

  line-height: 1.05;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans",
    sans-serif;

  font-weight: 900;

  /*
    ここが重要
    マークを指でドラッグ可能にする
  */

  pointer-events: auto;

  touch-action: none;

  user-select: none;

  -webkit-user-select: none;

  cursor: grab;

  padding: 3px;

  max-width: 90%;

  overflow-wrap: anywhere;

  text-shadow:
    1px 1px 2px rgba(0,0,0,0.35);

}


/* ドラッグ中 */

.mark.dragging {

  cursor: grabbing;

  transform:
    translate(-50%, -50%)
    scale(1.08);

  z-index: 50;

}


/* 上書きした時 */

.mark.overwrite-target {

  outline: 3px dashed #ffff00;

  outline-offset: 2px;

}


/* =========================
   説明
========================= */

.help {

  width: min(100vw, 1024px);

  margin: 0 auto;

  padding: 8px 12px;

  background: #181818;

  color: #ddd;

  font-size: 13px;

  line-height: 1.5;

  text-align: center;

}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  .toolbar {

    gap: 6px;

    padding: 6px;

  }


  button,
  .fileBtn {

    padding: 8px 10px;

    font-size: 13px;

  }


  .mark-control,
  .color-control,
  .size-control {

    font-size: 12px;

  }


  #markInput {

    width: 110px;

    min-height: 54px;

    font-size: 18px;

  }


  #markColor {

    width: 40px;

    height: 36px;

  }


  #markSize {

    width: 85px;

    min-width: 85px;

  }


  .help {

    font-size: 12px;

    padding: 6px;

  }

}

</style>

</head>


<body>


<!-- =========================
     操作バー
========================= -->

<div class="toolbar">


  <!-- 画像変更 -->

  <label class="fileBtn">

    🖼️ 画像を変更

    <input
      id="imageFile"
      type="file"
      accept="image/*"
    >

  </label>


  <!-- マーク入力 -->

  <div class="mark-control">

    ✏️ マーク

    <textarea
      id="markInput"
      maxlength="30"
      placeholder="例：⭕️&#10;名前"
    >⭕️</textarea>

  </div>


  <!-- 色 -->

  <div class="color-control">

    🎨 色

    <input
      id="markColor"
      type="color"
      value="#ff0000"
    >

  </div>


  <!-- サイズ -->

  <div class="size-control">

    📏 サイズ

    <input
      type="range"
      id="markSize"
      min="8"
      max="150"
      value="40"
    >

    <span id="sizeValue">
      40px
    </span>

  </div>


  <!-- 消しゴム -->

  <button id="eraseMode">

    🧹 消しゴム

  </button>


  <!-- 1つ戻す -->

  <button id="undo">

    ↩ 1つ戻す

  </button>


  <!-- 全部消す -->

  <button id="clear">

    🗑️ 全部消す

  </button>


</div>


<!-- =========================
     操作説明
========================= -->

<div class="help">

  画像をタップ → マーク追加　
  ／　
  マークをドラッグ → 自由に移動　
  ／　
  マークを軽くタップ → 上書き　
  ／　
  🧹消しゴム → 削除

</div>


<!-- =========================
     画像
========================= -->

<div id="board">

  <img
    id="base"
    src="https://picsum.photos/800/1000"
    alt="タップしてマークを付ける画像"
  >

</div>



<script>


/* =========================
   要素
========================= */

const board =
  document.getElementById("board");

const base =
  document.getElementById("base");

const imageFile =
  document.getElementById("imageFile");

const markInput =
  document.getElementById("markInput");

const markColor =
  document.getElementById("markColor");

const markSize =
  document.getElementById("markSize");

const sizeValue =
  document.getElementById("sizeValue");

const eraseMode =
  document.getElementById("eraseMode");

const undo =
  document.getElementById("undo");

const clear =
  document.getElementById("clear");


/* =========================
   マーク一覧
========================= */

let marks = [];


/* =========================
   消しゴム
========================= */

let isEraseMode = false;


/* =========================
   マーク文字取得
========================= */

function getMarkText() {

  let text =
    markInput.value;

  if (text.trim() === "") {

    text = "⭕️";

  }

  return text;

}


/* =========================
   マーク作成
========================= */

function createMark(x, y) {

  const mark =
    document.createElement("div");


  mark.className =
    "mark";


  mark.textContent =
    getMarkText();


  mark.style.left =
    x + "px";


  mark.style.top =
    y + "px";


  mark.style.fontSize =
    markSize.value + "px";


  mark.style.color =
    markColor.value;


  /*
    マークの位置を
    board内の座標として保存
  */

  mark.dataset.x = x;

  mark.dataset.y = y;


  /* =========================
     ドラッグ用変数
  ========================= */

  let dragging = false;

  let moved = false;

  let startPointerX = 0;

  let startPointerY = 0;

  let startMarkX = 0;

  let startMarkY = 0;


  /* =========================
     指を押した
  ========================= */

  mark.addEventListener(
    "pointerdown",
    function(e) {

      e.preventDefault();

      e.stopPropagation();


      /*
        ポインターを
        このマークが保持
      */

      try {

        mark.setPointerCapture(
          e.pointerId
        );

      } catch(error) {}


      dragging = false;

      moved = false;


      startPointerX =
        e.clientX;


      startPointerY =
        e.clientY;


      startMarkX =
        parseFloat(mark.dataset.x);


      startMarkY =
        parseFloat(mark.dataset.y);

    }
  );


  /* =========================
     指を動かす
  ========================= */

  mark.addEventListener(
    "pointermove",
    function(e) {

      /*
        pointerdownしていない場合
      */

      if (
        startPointerX === null
      ) {

        return;

      }


      const dx =
        e.clientX - startPointerX;


      const dy =
        e.clientY - startPointerY;


      /*
        少し動いたら
        ドラッグ開始
      */

      if (
        Math.abs(dx) > 5 ||
        Math.abs(dy) > 5
      ) {

        dragging = true;

        moved = true;

        mark.classList.add(
          "dragging"
        );

      }


      if (!dragging) {

        return;

      }


      /*
        boardの現在サイズ
      */

      const rect =
        board.getBoundingClientRect();


      /*
        画面上の移動量を
        boardの座標に変換

        スマホで画像が縮小表示
        されていても正しく動く
      */

      const scaleX =
        rect.width /
        base.naturalWidth;


      /*
        実際に表示されている
        boardの比率を使用
      */

      const ratio =
        rect.width /
        base.offsetWidth;


      let newX =
        startMarkX +
        dx;


      let newY =
        startMarkY +
        dy;


      /*
        画像の範囲内に収める
      */

      newX =
        Math.max(
          0,
          Math.min(
            rect.width,
            newX
          )
        );


      newY =
        Math.max(
          0,
          Math.min(
            rect.height,
            newY
          )
        );


      mark.style.left =
        newX + "px";


      mark.style.top =
        newY + "px";


      mark.dataset.x =
        newX;


      mark.dataset.y =
        newY;

    }
  );


  /* =========================
     指を離した
  ========================= */

  mark.addEventListener(
    "pointerup",
    function(e) {

      e.preventDefault();

      e.stopPropagation();


      mark.classList.remove(
        "dragging"
      );


      /*
        ドラッグした場合は
        上書きしない
      */

      if (moved) {

        dragging = false;

        moved = false;

        startPointerX = null;

        startPointerY = null;

        return;

      }


      /*
        消しゴム
      */

      if (isEraseMode) {

        removeMark(mark);

        return;

      }


      /*
        動かしていない場合は
        上書き
      */

      overwriteMark(mark);


      dragging = false;

      moved = false;

      startPointerX = null;

      startPointerY = null;

    }
  );


  /* =========================
     pointercancel
  ========================= */

  mark.addEventListener(
    "pointercancel",
    function() {

      dragging = false;

      moved = false;

      mark.classList.remove(
        "dragging"
      );

      startPointerX = null;

      startPointerY = null;

    }
  );


  board.appendChild(mark);

  marks.push(mark);

}


/* =========================
   マーク追加
========================= */

function addMark(clientX, clientY) {

  const rect =
    board.getBoundingClientRect();


  const x =
    clientX - rect.left;


  const y =
    clientY - rect.top;


  createMark(x, y);

}


/* =========================
   上書き
========================= */

function overwriteMark(mark) {

  mark.textContent =
    getMarkText();


  mark.style.color =
    markColor.value;


  mark.style.fontSize =
    markSize.value + "px";


  mark.classList.add(
    "overwrite-target"
  );


  setTimeout(
    function() {

      mark.classList.remove(
        "overwrite-target"
      );

    },
    300
  );

}


/* =========================
   マーク削除
========================= */

function removeMark(mark) {

  const index =
    marks.indexOf(mark);


  if (index !== -1) {

    marks.splice(
      index,
      1
    );

  }


  mark.remove();

}


/* =========================
   画像タップ
========================= */

board.addEventListener(
  "pointerup",
  function(e) {

    /*
      マーク自身は無視
    */

    if (
      e.target.classList.contains("mark")
    ) {

      return;

    }


    /*
      画像以外は無視
    */

    if (
      e.target !== board &&
      e.target !== base
    ) {

      return;

    }


    /*
      消しゴム中は
      新しいマークを作らない
    */

    if (isEraseMode) {

      return;

    }


    addMark(
      e.clientX,
      e.clientY
    );

  }
);


/* =========================
   サイズ変更
========================= */

markSize.addEventListener(
  "input",
  function() {

    const size =
      Number(this.value);


    sizeValue.textContent =
      size + "px";


    marks.forEach(
      function(mark) {

        mark.style.fontSize =
          size + "px";

      }
    );

  }
);


/* =========================
   色変更
========================= */

markColor.addEventListener(
  "input",
  function() {

    const color =
      this.value;


    marks.forEach(
      function(mark) {

        mark.style.color =
          color;

      }
    );

  }
);


/* =========================
   消しゴム
========================= */

eraseMode.addEventListener(
  "click",
  function() {

    isEraseMode =
      !isEraseMode;


    if (isEraseMode) {

      eraseMode.textContent =
        "🧹 消しゴムON";


      eraseMode.classList.add(
        "active"
      );

    }
    else {

      eraseMode.textContent =
        "🧹 消しゴム";


      eraseMode.classList.remove(
        "active"
      );

    }

  }
);


/* =========================
   画像変更
========================= */

imageFile.addEventListener(
  "change",
  function(e) {

    const file =
      e.target.files[0];


    if (!file) {

      return;

    }


    const url =
      URL.createObjectURL(file);


    base.onload =
      function() {

        URL.revokeObjectURL(url);

      };


    base.src =
      url;


    /*
      画像変更時は
      マークを全部削除
    */

    marks.forEach(
      function(mark) {

        mark.remove();

      }
    );


    marks = [];

  }
);


/* =========================
   1つ戻す
========================= */

undo.addEventListener(
  "click",
  function() {

    const mark =
      marks.pop();


    if (mark) {

      mark.remove();

    }

  }
);


/* =========================
   全部消す
========================= */

clear.addEventListener(
  "click",
  function() {

    marks.forEach(
      function(mark) {

        mark.remove();

      }
    );


    marks = [];

  }
);

</script>

</body>
</html>
