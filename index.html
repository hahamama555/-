<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>自由マークつけツール</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #111;
  color: white;
  font-family: sans-serif;
}


/* =========================
   操作バー
========================= */

.toolbar {

  position: sticky;
  top: 0;
  z-index: 100;

  display: flex;
  gap: 8px;

  align-items: center;
  justify-content: center;

  flex-wrap: wrap;

  padding: 8px;

  background: #222;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.5);
}


/* =========================
   ボタン
========================= */

button,
.fileBtn {

  border: none;

  border-radius: 10px;

  padding: 10px 14px;

  font-size: 15px;

  font-weight: bold;

  color: #111;

  background: white;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;

  -webkit-tap-highlight-color: transparent;
}

button:active,
.fileBtn:active {
  transform: scale(0.96);
}

.fileBtn {

  display: inline-flex;

  align-items: center;

  justify-content: center;
}

.fileBtn input {
  display: none;
}


/* =========================
   マーク入力
========================= */

.mark-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;
}


#markInput {

  width: 130px;

  min-height: 58px;

  max-height: 100px;

  resize: vertical;

  border: none;

  border-radius: 8px;

  padding: 6px 8px;

  font-size: 20px;

  line-height: 1.2;

  text-align: center;

  background: white;

  color: #111;

  font-family: sans-serif;
}


/* =========================
   色
========================= */

.color-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;
}


#markColor {

  width: 45px;

  height: 38px;

  border: none;

  border-radius: 8px;

  padding: 2px;

  background: white;

  cursor: pointer;
}


/* =========================
   新規マークサイズ
========================= */

.size-control {

  display: flex;

  align-items: center;

  gap: 6px;

  font-size: 13px;

  color: white;
}


#markSize {

  width: 100px;

  min-width: 100px;
}


#sizeValue {

  min-width: 45px;

  text-align: center;
}


/* =========================
   消しゴム
========================= */

#eraseMode {

  background: #ffdddd;

  color: #b00000;
}


#eraseMode.active {

  background: #ff3333;

  color: white;

  box-shadow:
    0 0 8px rgba(255,0,0,0.7);
}


/* =========================
   画像
========================= */

#board {

  position: relative;

  width: min(100vw, 1024px);

  margin: 0 auto;

  line-height: 0;

  user-select: none;

  -webkit-user-select: none;

  overflow: hidden;
}


#board img {

  display: block;

  width: 100%;

  height: auto;

  pointer-events: none;

  user-select: none;

  -webkit-user-drag: none;
}


/* =========================
   マーク
========================= */

.mark {

  position: absolute;

  transform: translate(-50%, -50%);

  display: flex;

  align-items: center;

  justify-content: center;

  white-space: pre-line;

  text-align: center;

  line-height: 1.05;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans",
    sans-serif;

  font-weight: 900;

  pointer-events: auto;

  touch-action: none;

  user-select: none;

  -webkit-user-select: none;

  cursor: grab;

  padding: 3px;

  max-width: 90%;

  overflow-wrap: anywhere;

  text-shadow:
    1px 1px 2px rgba(0,0,0,0.35);

  /*
    サイズ変更時に
    ブラウザ側のアニメーションを
    入れず、指の動きに直接追従
  */

  transition: none;

  will-change:
    left,
    top,
    font-size;

}


/* =========================
   ドラッグ中
========================= */

.mark.dragging {

  cursor: grabbing;

  transform:
    translate(-50%, -50%);

  z-index: 50;
}


/* =========================
   選択中
========================= */

.mark.selected {

  outline: 2px dashed #ffff00;

  outline-offset: 3px;
}


/* =========================
   上書き
========================= */

.mark.overwrite-target {

  outline: 3px dashed #00ff00;

  outline-offset: 3px;
}


/* =========================
   説明
========================= */

.help {

  width: min(100vw, 1024px);

  margin: 0 auto;

  padding: 8px 12px;

  background: #181818;

  color: #ddd;

  font-size: 13px;

  line-height: 1.5;

  text-align: center;
}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  .toolbar {

    gap: 6px;

    padding: 6px;
  }


  button,
  .fileBtn {

    padding: 8px 10px;

    font-size: 13px;
  }


  .mark-control,
  .color-control,
  .size-control {

    font-size: 12px;
  }


  #markInput {

    width: 110px;

    min-height: 54px;

    font-size: 18px;
  }


  #markColor {

    width: 40px;

    height: 36px;
  }


  #markSize {

    width: 85px;

    min-width: 85px;
  }


  .help {

    font-size: 12px;

    padding: 6px;
  }

}

</style>

</head>


<body>


<!-- =========================
     操作バー
========================= -->

<div class="toolbar">


  <label class="fileBtn">

    🖼️ 画像を変更

    <input
      id="imageFile"
      type="file"
      accept="image/*"
    >

  </label>


  <div class="mark-control">

    ✏️ マーク

    <textarea
      id="markInput"
      maxlength="30"
      placeholder="例：⭕️&#10;名前"
    >⭕️</textarea>

  </div>


  <div class="color-control">

    🎨 色

    <input
      id="markColor"
      type="color"
      value="#ff0000"
    >

  </div>


  <div class="size-control">

    📏 初期サイズ

    <input
      type="range"
      id="markSize"
      min="8"
      max="200"
      value="40"
    >

    <span id="sizeValue">
      40px
    </span>

  </div>


  <button id="eraseMode">

    🧹 消しゴム

  </button>


  <button id="undo">

    ↩ 1つ戻す

  </button>


  <button id="clear">

    🗑️ 全部消す

  </button>

</div>


<!-- =========================
     説明
========================= -->

<div class="help">

  1本指：移動　／　
  2本指：なめらかに拡大・縮小　／　
  軽くタップ：上書き

</div>


<!-- =========================
     画像
========================= -->

<div id="board">

  <img
    id="base"
    src="https://picsum.photos/800/1000"
    alt="タップしてマークを付ける画像"
  >

</div>



<script>

/* =========================
   要素
========================= */

const board =
  document.getElementById("board");

const base =
  document.getElementById("base");

const imageFile =
  document.getElementById("imageFile");

const markInput =
  document.getElementById("markInput");

const markColor =
  document.getElementById("markColor");

const markSize =
  document.getElementById("markSize");

const sizeValue =
  document.getElementById("sizeValue");

const eraseMode =
  document.getElementById("eraseMode");

const undo =
  document.getElementById("undo");

const clear =
  document.getElementById("clear");


/* =========================
   マーク一覧
========================= */

let marks = [];


/* =========================
   消しゴム
========================= */

let isEraseMode = false;


/* =========================
   文字取得
========================= */

function getMarkText() {

  let text =
    markInput.value;

  if (text.trim() === "") {

    text = "⭕️";

  }

  return text;

}


/* =========================
   マーク作成
========================= */

function createMark(x, y) {

  const mark =
    document.createElement("div");


  mark.className =
    "mark";


  mark.textContent =
    getMarkText();


  /* =====================
     初期位置
  ===================== */

  mark.style.left =
    x + "px";

  mark.style.top =
    y + "px";


  /* =====================
     初期サイズ
  ===================== */

  const initialSize =
    Number(markSize.value);


  mark.style.fontSize =
    initialSize + "px";


  mark.dataset.x = x;

  mark.dataset.y = y;

  mark.dataset.size =
    initialSize;


  /* =====================
     色
  ===================== */

  mark.style.color =
    markColor.value;


  /* =====================
     指情報
  ===================== */

  const pointers =
    new Map();


  /*
    1本指移動用
  */

  let startX = 0;

  let startY = 0;

  let startMarkX = 0;

  let startMarkY = 0;


  /*
    ピンチ用
  */

  let startDistance = 0;

  let startSize = initialSize;


  /*
    操作状態
  */

  let moved = false;

  let pinching = false;


/* =========================
   2点間距離
========================= */

  function getDistance() {

    const values =
      Array.from(
        pointers.values()
      );


    if (values.length < 2) {

      return 0;

    }


    const p1 =
      values[0];

    const p2 =
      values[1];


    const dx =
      p2.x - p1.x;

    const dy =
      p2.y - p1.y;


    return Math.sqrt(
      dx * dx +
      dy * dy
    );

  }


/* =========================
   pointerdown
========================= */

  mark.addEventListener(
    "pointerdown",
    function(e) {

      e.preventDefault();

      e.stopPropagation();


      pointers.set(
        e.pointerId,
        {
          x: e.clientX,
          y: e.clientY
        }
      );


      try {

        mark.setPointerCapture(
          e.pointerId
        );

      } catch(error) {}


      /* ===================
         1本目
      =================== */

      if (
        pointers.size === 1
      ) {

        startX =
          e.clientX;

        startY =
          e.clientY;


        startMarkX =
          Number(
            mark.dataset.x
          );

        startMarkY =
          Number(
            mark.dataset.y
          );


        moved = false;

        pinching = false;

      }


      /* ===================
         2本目
      =================== */

      if (
        pointers.size === 2
      ) {

        startDistance =
          getDistance();


        startSize =
          Number(
            mark.dataset.size
          );


        pinching = true;

        moved = true;


        mark.classList.add(
          "selected"
        );

      }

    }
  );


/* =========================
   pointermove
========================= */

  mark.addEventListener(
    "pointermove",
    function(e) {

      if (
        !pointers.has(
          e.pointerId
        )
      ) {

        return;

      }


      e.preventDefault();

      e.stopPropagation();


      /*
        指の位置更新
      */

      pointers.set(
        e.pointerId,
        {
          x: e.clientX,
          y: e.clientY
        }
      );


      /* ===================
         2本指
         ピンチ
      =================== */

      if (
        pointers.size >= 2
      ) {

        const distance =
          getDistance();


        if (
          startDistance > 0
        ) {

          /*
            現在距離 ÷ 開始距離

            これで指の動きに
            完全に連動
          */

          const ratio =
            distance /
            startDistance;


          /*
            新しいサイズ
          */

          let newSize =
            startSize * ratio;


          /*
            8〜200px
          */

          newSize =
            Math.max(
              8,
              Math.min(
                200,
                newSize
              )
            );


          /*
            小数を残すことで
            滑らかに変化
          */

          mark.style.fontSize =
            newSize + "px";


          mark.dataset.size =
            newSize;


          /*
            ブラウザの描画を
            即座に更新
          */

          mark.style.willChange =
            "font-size";

        }


        return;

      }


      /* ===================
         1本指
         移動
      =================== */

      if (pinching) {

        return;

      }


      const dx =
        e.clientX - startX;


      const dy =
        e.clientY - startY;


      if (
        Math.abs(dx) > 3 ||
        Math.abs(dy) > 3
      ) {

        moved = true;

        mark.classList.add(
          "dragging"
        );

      }


      if (!moved) {

        return;

      }


      const rect =
        board.getBoundingClientRect();


      let newX =
        startMarkX + dx;


      let newY =
        startMarkY + dy;


      /*
        画像外に出ないようにする
      */

      newX =
        Math.max(
          0,
          Math.min(
            rect.width,
            newX
          )
        );


      newY =
        Math.max(
          0,
          Math.min(
            rect.height,
            newY
          )
        );


      mark.style.left =
        newX + "px";


      mark.style.top =
        newY + "px";


      mark.dataset.x =
        newX;


      mark.dataset.y =
        newY;

    }
  );


/* =========================
   pointerup
========================= */

  mark.addEventListener(
    "pointerup",
    function(e) {

      e.preventDefault();

      e.stopPropagation();


      pointers.delete(
        e.pointerId
      );


      /*
        まだ指が残っている
      */

      if (
        pointers.size > 0
      ) {

        /*
          2本指から1本指に
          戻った場合は、
          そのまま移動開始しない
        */

        if (
          pointers.size === 1
        ) {

          pinching = false;

          const remaining =
            Array.from(
              pointers.values()
            )[0];

          startX =
            remaining.x;

          startY =
            remaining.y;

          startMarkX =
            Number(
              mark.dataset.x
            );

          startMarkY =
            Number(
              mark.dataset.y
            );

        }

        return;

      }


      mark.classList.remove(
        "dragging"
      );

      mark.classList.remove(
        "selected"
      );


      /*
        ピンチ終了
      */

      if (pinching) {

        pinching = false;

        moved = false;

        mark.style.willChange =
          "auto";

        return;

      }


      /*
        移動した場合
      */

      if (moved) {

        moved = false;

        return;

      }


      /*
        消しゴム
      */

      if (isEraseMode) {

        removeMark(mark);

        return;

      }


      /*
        タップ
        → 上書き
      */

      overwriteMark(mark);

    }
  );


/* =========================
   pointercancel
========================= */

  mark.addEventListener(
    "pointercancel",
    function(e) {

      pointers.delete(
        e.pointerId
      );


      mark.classList.remove(
        "dragging"
      );


      mark.classList.remove(
        "selected"
      );


      pinching = false;

      moved = false;

    }
  );


  board.appendChild(mark);

  marks.push(mark);

}


/* =========================
   マーク追加
========================= */

function addMark(
  clientX,
  clientY
) {

  const rect =
    board.getBoundingClientRect();


  const x =
    clientX - rect.left;


  const y =
    clientY - rect.top;


  createMark(
    x,
    y
  );

}


/* =========================
   上書き
========================= */

function overwriteMark(mark) {

  mark.textContent =
    getMarkText();


  mark.style.color =
    markColor.value;


  /*
    上書き時は
    現在のサイズを維持

    ※これがポイント
  */

  const currentSize =
    Number(
      mark.dataset.size
    );


  mark.style.fontSize =
    currentSize + "px";


  mark.classList.add(
    "overwrite-target"
  );


  setTimeout(
    function() {

      mark.classList.remove(
        "overwrite-target"
      );

    },
    300
  );

}


/* =========================
   削除
========================= */

function removeMark(mark) {

  const index =
    marks.indexOf(mark);


  if (index !== -1) {

    marks.splice(
      index,
      1
    );

  }


  mark.remove();

}


/* =========================
   画像タップ
========================= */

board.addEventListener(
  "pointerup",
  function(e) {

    if (
      e.target.classList.contains(
        "mark"
      )
    ) {

      return;

    }


    if (
      e.target !== board &&
      e.target !== base
    ) {

      return;

    }


    if (isEraseMode) {

      return;

    }


    addMark(
      e.clientX,
      e.clientY
    );

  }
);


/* =========================
   初期サイズ
========================= */

markSize.addEventListener(
  "input",
  function() {

    const size =
      Number(this.value);


    sizeValue.textContent =
      size + "px";

    /*
      既存マークは変更しない
    */

  }
);


/* =========================
   色
========================= */

markColor.addEventListener(
  "input",
  function() {

    /*
      新しく作るマークに
      適用する色

      既存マークは変更しない
    */

  }
);


/* =========================
   消しゴム
========================= */

eraseMode.addEventListener(
  "click",
  function() {

    isEraseMode =
      !isEraseMode;


    if (isEraseMode) {

      eraseMode.textContent =
        "🧹 消しゴムON";

      eraseMode.classList.add(
        "active"
      );

    }
    else {

      eraseMode.textContent =
        "🧹 消しゴム";

      eraseMode.classList.remove(
        "active"
      );

    }

  }
);


/* =========================
   画像変更
========================= */

imageFile.addEventListener(
  "change",
  function(e) {

    const file =
      e.target.files[0];


    if (!file) {

      return;

    }


    const url =
      URL.createObjectURL(file);


    base.onload =
      function() {

        URL.revokeObjectURL(url);

      };


    base.src =
      url;


    /*
      画像変更時
      マークを全削除
    */

    marks.forEach(
      function(mark) {

        mark.remove();

      }
    );


    marks = [];

  }
);


/* =========================
   1つ戻す
========================= */

undo.addEventListener(
  "click",
  function() {

    const mark =
      marks.pop();


    if (mark) {

      mark.remove();

    }

  }
);


/* =========================
   全部消す
========================= */

clear.addEventListener(
  "click",
  function() {

    marks.forEach(
      function(mark) {

        mark.remove();

      }
    );


    marks = [];

  }
);

</script>

</body>
</html>
