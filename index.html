<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>自由マークつけツール</title>

<style>

/* =========================
   基本
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  background: #111;

  color: white;

  font-family: sans-serif;
}


/* =========================
   操作バー
========================= */

.toolbar {

  position: sticky;

  top: 0;

  z-index: 1000;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-wrap: wrap;

  gap: 8px;

  padding: 8px;

  background: #222;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.5);
}


/* =========================
   ボタン
========================= */

button,
.fileBtn {

  border: none;

  border-radius: 10px;

  padding: 10px 14px;

  font-size: 15px;

  font-weight: bold;

  color: #111;

  background: white;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;

  -webkit-tap-highlight-color: transparent;
}

button:active,
.fileBtn:active {

  transform: scale(0.97);

}


.fileBtn {

  display: inline-flex;

  align-items: center;

  justify-content: center;
}


.fileBtn input {

  display: none;

}


/* =========================
   マーク入力
========================= */

.mark-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;
}


#markInput {

  width: 130px;

  min-height: 58px;

  max-height: 100px;

  resize: vertical;

  border: none;

  border-radius: 8px;

  padding: 6px 8px;

  font-size: 20px;

  line-height: 1.2;

  text-align: center;

  background: white;

  color: #111;

  font-family: sans-serif;
}


/* =========================
   色
========================= */

.color-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;
}


#markColor {

  width: 45px;

  height: 38px;

  border: none;

  border-radius: 8px;

  padding: 2px;

  background: white;

  cursor: pointer;
}


/* =========================
   サイズ
========================= */

.size-control {

  display: flex;

  align-items: center;

  gap: 6px;

  font-size: 13px;

  color: white;

  padding: 4px 6px;

  border-radius: 8px;

  background: #333;
}


#markSize {

  width: 120px;

  min-width: 120px;

  cursor: pointer;
}


#sizeValue {

  min-width: 48px;

  text-align: center;

  font-weight: bold;
}


/* =========================
   選択中表示
========================= */

#selectedInfo {

  min-width: 100px;

  text-align: center;

  font-size: 12px;

  color: #ffff00;
}


/* =========================
   消しゴム
========================= */

#eraseMode {

  background: #ffdddd;

  color: #b00000;
}


#eraseMode.active {

  background: #ff3333;

  color: white;

  box-shadow:
    0 0 8px rgba(255,0,0,0.7);
}


/* =========================
   画像エリア
========================= */

#board {

  position: relative;

  width: min(100vw, 1024px);

  margin: 0 auto;

  line-height: 0;

  overflow: hidden;

  user-select: none;

  -webkit-user-select: none;

  touch-action: manipulation;
}


#board img {

  display: block;

  width: 100%;

  height: auto;

  pointer-events: none;

  user-select: none;

  -webkit-user-drag: none;
}


/* =========================
   マーク
========================= */

.mark {

  position: absolute;

  transform: translate(-50%, -50%);

  display: flex;

  align-items: center;

  justify-content: center;

  white-space: pre-line;

  text-align: center;

  line-height: 1.05;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans",
    sans-serif;

  font-weight: 900;

  pointer-events: auto;

  touch-action: none;

  user-select: none;

  -webkit-user-select: none;

  cursor: grab;

  padding: 3px;

  max-width: 90%;

  overflow-wrap: anywhere;

  text-shadow:
    1px 1px 2px rgba(0,0,0,0.35);

  /*
    移動時に形を変えない
  */

  transition: none;

  will-change:
    left,
    top,
    font-size;
}


/* =========================
   選択中
========================= */

.mark.selected {

  outline: 2px dashed #ffff00;

  outline-offset: 4px;

  z-index: 100;
}


/* =========================
   ドラッグ中
========================= */

.mark.dragging {

  cursor: grabbing;

}


/* =========================
   上書き表示
========================= */

.mark.overwrite-target {

  outline: 3px dashed #00ff00;

  outline-offset: 4px;

}


/* =========================
   説明
========================= */

.help {

  width: min(100vw, 1024px);

  margin: 0 auto;

  padding: 8px 12px;

  background: #181818;

  color: #ddd;

  font-size: 13px;

  line-height: 1.5;

  text-align: center;
}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  .toolbar {

    gap: 6px;

    padding: 6px;
  }


  button,
  .fileBtn {

    padding: 8px 10px;

    font-size: 13px;
  }


  .mark-control,
  .color-control,
  .size-control {

    font-size: 12px;
  }


  #markInput {

    width: 110px;

    min-height: 54px;

    font-size: 18px;
  }


  #markColor {

    width: 40px;

    height: 36px;
  }


  #markSize {

    width: 100px;

    min-width: 100px;
  }


  #selectedInfo {

    min-width: 80px;

    font-size: 11px;
  }


  .help {

    font-size: 12px;

    padding: 6px;
  }

}

</style>

</head>


<body>


<!-- =========================
     操作バー
========================= -->

<div class="toolbar">


  <!-- 画像変更 -->

  <label class="fileBtn">

    🖼️ 画像を変更

    <input
      id="imageFile"
      type="file"
      accept="image/*"
    >

  </label>


  <!-- マーク入力 -->

  <div class="mark-control">

    ✏️ マーク

    <textarea
      id="markInput"
      maxlength="30"
      placeholder="例：⭕️&#10;名前"
    >⭕️</textarea>

  </div>


  <!-- 色 -->

  <div class="color-control">

    🎨 色

    <input
      id="markColor"
      type="color"
      value="#ff0000"
    >

  </div>


  <!-- サイズ -->

  <div class="size-control">

    📏 サイズ

    <input
      type="range"
      id="markSize"
      min="8"
      max="200"
      value="40"
      step="1"
    >

    <span id="sizeValue">
      40px
    </span>

  </div>


  <!-- 選択中 -->

  <div id="selectedInfo">

    未選択

  </div>


  <!-- 消しゴム -->

  <button id="eraseMode">

    🧹 消しゴム

  </button>


  <!-- 1つ戻す -->

  <button id="undo">

    ↩ 1つ戻す

  </button>


  <!-- 全部消す -->

  <button id="clear">

    🗑️ 全部消す

  </button>

</div>


<!-- =========================
     説明
========================= -->

<div class="help">

  画像をタップ＝マーク追加　
  ／　
  マークをタップ＝選択　
  ／　
  選択したマークをドラッグ＝移動　
  ／　
  サイズバー＝選択中のマークだけ変更

</div>


<!-- =========================
     画像
========================= -->

<div id="board">

  <img
    id="base"
    src="https://picsum.photos/800/1000"
    alt="タップしてマークを付ける画像"
  >

</div>



<script>


/* =========================
   要素
========================= */

const board =
  document.getElementById("board");

const base =
  document.getElementById("base");

const imageFile =
  document.getElementById("imageFile");

const markInput =
  document.getElementById("markInput");

const markColor =
  document.getElementById("markColor");

const markSize =
  document.getElementById("markSize");

const sizeValue =
  document.getElementById("sizeValue");

const selectedInfo =
  document.getElementById("selectedInfo");

const eraseMode =
  document.getElementById("eraseMode");

const undo =
  document.getElementById("undo");

const clear =
  document.getElementById("clear");


/* =========================
   マーク一覧
========================= */

let marks = [];


/* =========================
   現在選択中のマーク
========================= */

let selectedMark = null;


/* =========================
   消しゴム
========================= */

let isEraseMode = false;


/* =========================
   文字取得
========================= */

function getMarkText() {

  let text =
    markInput.value;


  if (text.trim() === "") {

    text = "⭕️";

  }


  return text;

}


/* =========================
   マーク選択
========================= */

function selectMark(mark) {

  /*
    以前の選択を解除
  */

  marks.forEach(
    function(item) {

      item.classList.remove(
        "selected"
      );

    }
  );


  /*
    新しいマークを選択
  */

  selectedMark = mark;


  if (mark) {

    mark.classList.add(
      "selected"
    );


    /*
      現在のサイズを
      バーに反映
    */

    const size =
      Number(
        mark.dataset.size
      );


    markSize.value =
      Math.round(size);


    sizeValue.textContent =
      Math.round(size) + "px";


    selectedInfo.textContent =
      "選択中：このマーク";

  }
  else {

    selectedInfo.textContent =
      "未選択";

  }

}


/* =========================
   マーク作成
========================= */

function createMark(x, y) {

  const mark =
    document.createElement("div");


  mark.className =
    "mark";


  /*
    文字
  */

  mark.textContent =
    getMarkText();


  /*
    位置
  */

  mark.style.left =
    x + "px";


  mark.style.top =
    y + "px";


  /*
    サイズ

    新しく書く時は
    サイズバーの値を使用
  */

  const initialSize =
    Number(markSize.value);


  mark.style.fontSize =
    initialSize + "px";


  /*
    データ保存
  */

  mark.dataset.x =
    x;

  mark.dataset.y =
    y;

  mark.dataset.size =
    initialSize;


  /*
    色
  */

  mark.style.color =
    markColor.value;


  /*
    移動用
  */

  let dragging = false;

  let moved = false;

  let pointerId = null;

  let startPointerX = 0;

  let startPointerY = 0;

  let startMarkX = x;

  let startMarkY = y;


  /* =========================
     pointerdown
  ========================= */

  mark.addEventListener(
    "pointerdown",
    function(e) {

      e.preventDefault();

      e.stopPropagation();


      /*
        消しゴム
      */

      if (isEraseMode) {

        removeMark(mark);

        return;

      }


      /*
        このマークを選択
      */

      selectMark(mark);


      /*
        ドラッグ開始
      */

      pointerId =
        e.pointerId;


      startPointerX =
        e.clientX;


      startPointerY =
        e.clientY;


      startMarkX =
        Number(
          mark.dataset.x
        );


      startMarkY =
        Number(
          mark.dataset.y
        );


      dragging = false;

      moved = false;


      try {

        mark.setPointerCapture(
          e.pointerId
        );

      } catch(error) {}

    }
  );


  /* =========================
     pointermove
  ========================= */

  mark.addEventListener(
    "pointermove",
    function(e) {

      if (
        pointerId !==
        e.pointerId
      ) {

        return;

      }


      e.preventDefault();

      e.stopPropagation();


      const dx =
        e.clientX -
        startPointerX;


      const dy =
        e.clientY -
        startPointerY;


      /*
        少し動いたら
        ドラッグ開始
      */

      if (
        Math.abs(dx) > 3 ||
        Math.abs(dy) > 3
      ) {

        dragging = true;

        moved = true;

        mark.classList.add(
          "dragging"
        );

      }


      if (!dragging) {

        return;

      }


      const rect =
        board.getBoundingClientRect();


      /*
        新しい位置
      */

      let newX =
        startMarkX + dx;


      let newY =
        startMarkY + dy;


      /*
        画像の中に収める
      */

      newX =
        Math.max(
          0,
          Math.min(
            rect.width,
            newX
          )
        );


      newY =
        Math.max(
          0,
          Math.min(
            rect.height,
            newY
          )
        );


      /*
        位置変更

        サイズには触れない
      */

      mark.style.left =
        newX + "px";


      mark.style.top =
        newY + "px";


      mark.dataset.x =
        newX;


      mark.dataset.y =
        newY;

    }
  );


  /* =========================
     pointerup
  ========================= */

  mark.addEventListener(
    "pointerup",
    function(e) {

      if (
        pointerId !==
        e.pointerId
      ) {

        return;

      }


      e.preventDefault();

      e.stopPropagation();


      mark.classList.remove(
        "dragging"
      );


      /*
        ドラッグ終了
      */

      dragging = false;

      pointerId = null;


      /*
        移動していない場合
        → 上書き
      */

      if (!moved) {

        overwriteMark(mark);

      }


      moved = false;

    }
  );


  /* =========================
     pointercancel
  ========================= */

  mark.addEventListener(
    "pointercancel",
    function() {

      dragging = false;

      moved = false;

      pointerId = null;

      mark.classList.remove(
        "dragging"
      );

    }
  );


  /*
    画像に追加
  */

  board.appendChild(mark);


  marks.push(mark);


  /*
    新しく作ったマークを
    自動選択
  */

  selectMark(mark);

}


/* =========================
   マーク追加
========================= */

function addMark(
  clientX,
  clientY
) {

  const rect =
    board.getBoundingClientRect();


  const x =
    clientX - rect.left;


  const y =
    clientY - rect.top;


  createMark(
    x,
    y
  );

}


/* =========================
   上書き
========================= */

function overwriteMark(mark) {

  /*
    現在のサイズを維持
  */

  const currentSize =
    Number(
      mark.dataset.size
    );


  /*
    入力文字
  */

  mark.textContent =
    getMarkText();


  /*
    色だけ変更
  */

  mark.style.color =
    markColor.value;


  /*
    サイズ維持
  */

  mark.style.fontSize =
    currentSize + "px";


  mark.classList.add(
    "overwrite-target"
  );


  setTimeout(
    function() {

      mark.classList.remove(
        "overwrite-target"
      );

    },
    300
  );

}


/* =========================
   サイズ変更
========================= */

markSize.addEventListener(
  "input",
  function() {

    const size =
      Number(this.value);


    sizeValue.textContent =
      size + "px";


    /*
      マークが選択されている場合
      → そのマークだけ変更
    */

    if (selectedMark) {

      selectedMark.style.fontSize =
        size + "px";


      selectedMark.dataset.size =
        size;

      return;

    }


    /*
      未選択の場合

      → 新しく書くマークの
        初期サイズとして使用

      既存マークは変更しない
    */

  }
);


/* =========================
   色変更
========================= */

markColor.addEventListener(
  "input",
  function() {

    /*
      選択中なら
      そのマークだけ色変更
    */

    if (selectedMark) {

      selectedMark.style.color =
        this.value;

      return;

    }

    /*
      未選択なら
      新しいマークの色になる
    */

  }
);


/* =========================
   画像タップ
========================= */

board.addEventListener(
  "pointerup",
  function(e) {

    /*
      マークを触った場合
      → ここでは何もしない
    */

    if (
      e.target.classList.contains(
        "mark"
      )
    ) {

      return;

    }


    /*
      画像以外は無視
    */

    if (
      e.target !== board &&
      e.target !== base
    ) {

      return;

    }


    /*
      消しゴム中
    */

    if (isEraseMode) {

      return;

    }


    /*
      画像タップで
      新しいマークを作る
    */

    addMark(
      e.clientX,
      e.clientY
    );

  }
);


/* =========================
   消しゴム
========================= */

eraseMode.addEventListener(
  "click",
  function() {

    isEraseMode =
      !isEraseMode;


    if (isEraseMode) {

      eraseMode.textContent =
        "🧹 消しゴムON";

      eraseMode.classList.add(
        "active"
      );

      /*
        消しゴム中は
        選択解除
      */

      selectMark(null);

    }
    else {

      eraseMode.textContent =
        "🧹 消しゴム";

      eraseMode.classList.remove(
        "active"
      );

    }

  }
);


/* =========================
   マーク削除
========================= */

function removeMark(mark) {

  const index =
    marks.indexOf(mark);


  if (index !== -1) {

    marks.splice(
      index,
      1
    );

  }


  /*
    選択中なら解除
  */

  if (
    selectedMark === mark
  ) {

    selectedMark = null;

    selectedInfo.textContent =
      "未選択";

  }


  mark.remove();

}


/* =========================
   画像変更
========================= */

imageFile.addEventListener(
  "change",
  function(e) {

    const file =
      e.target.files[0];


    if (!file) {

      return;

    }


    const url =
      URL.createObjectURL(file);


    base.onload =
      function() {

        URL.revokeObjectURL(url);

      };


    base.src =
      url;


    /*
      マーク全削除
    */

    marks.forEach(
      function(mark) {

        mark.remove();

      }
    );


    marks = [];


    selectedMark = null;


    selectedInfo.textContent =
      "未選択";

  }
);


/* =========================
   1つ戻す
========================= */

undo.addEventListener(
  "click",
  function() {

    const mark =
      marks.pop();


    if (!mark) {

      return;

    }


    if (
      selectedMark === mark
    ) {

      selectedMark = null;

      selectedInfo.textContent =
        "未選択";

    }


    mark.remove();


    /*
      1つ前のマークを
      選択状態にする
    */

    if (
      marks.length > 0
    ) {

      selectMark(
        marks[marks.length - 1]
      );

    }

  }
);


/* =========================
   全部消す
========================= */

clear.addEventListener(
  "click",
  function() {

    marks.forEach(
      function(mark) {

        mark.remove();

      }
    );


    marks = [];


    selectedMark = null;


    selectedInfo.textContent =
      "未選択";

  }
);

</script>

</body>
</html>
