<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>自由マークつけツール</title>


<style>

/* =================================
   基本設定
================================= */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  background: #111;

  color: white;

  font-family: sans-serif;

}


/* =================================
   操作バー
================================= */

.toolbar {

  position: sticky;

  top: 0;

  z-index: 1000;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-wrap: wrap;

  gap: 8px;

  padding: 8px;

  background: #222;

  box-shadow:
    0 2px 8px rgba(0,0,0,0.5);

}


/* =================================
   ボタン
================================= */

button,
.fileBtn {

  border: none;

  border-radius: 10px;

  padding: 10px 14px;

  font-size: 15px;

  font-weight: bold;

  color: #111;

  background: white;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;

  -webkit-tap-highlight-color: transparent;

}


button:active,
.fileBtn:active {

  transform: scale(0.97);

}


.fileBtn {

  display: inline-flex;

  align-items: center;

  justify-content: center;

}


.fileBtn input {

  display: none;

}


/* =================================
   マーク入力
================================= */

.mark-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;

}


#markInput {

  width: 130px;

  height: 58px;

  resize: vertical;

  border: none;

  border-radius: 8px;

  padding: 6px 8px;

  font-size: 20px;

  line-height: 1.1;

  text-align: center;

  background: white;

  color: #111;

  font-family: sans-serif;

}


/* =================================
   色
================================= */

.color-control {

  display: flex;

  align-items: center;

  gap: 5px;

  font-size: 13px;

}


#markColor {

  width: 45px;

  height: 38px;

  border: none;

  border-radius: 8px;

  padding: 2px;

  background: white;

  cursor: pointer;

}


/* =================================
   サイズ
================================= */

.size-control {

  display: flex;

  align-items: center;

  gap: 6px;

  padding: 5px 7px;

  border-radius: 8px;

  background: #333;

  font-size: 13px;

  color: white;

}


#markSize {

  width: 120px;

  min-width: 120px;

  cursor: pointer;

}


#sizeValue {

  min-width: 48px;

  text-align: center;

  font-weight: bold;

}


/* =================================
   選択情報
================================= */

#selectedInfo {

  min-width: 90px;

  text-align: center;

  font-size: 12px;

  color: #ffff00;

}


/* =================================
   消しゴム
================================= */

#eraseMode {

  background: #ffdddd;

  color: #b00000;

}


#eraseMode.active {

  background: #ff3333;

  color: white;

  box-shadow:
    0 0 8px rgba(255,0,0,0.7);

}


/* =================================
   説明
================================= */

.help {

  width: min(100vw, 1024px);

  margin: 0 auto;

  padding: 8px 12px;

  background: #181818;

  color: #ddd;

  font-size: 13px;

  line-height: 1.5;

  text-align: center;

}


/* =================================
   画像ボード
================================= */

#board {

  position: relative;

  width: min(100vw, 1024px);

  margin: 0 auto;

  line-height: 0;

  overflow: hidden;

  user-select: none;

  -webkit-user-select: none;

  /*
    画像をタップするため
  */

  touch-action: manipulation;

}


#board img {

  display: block;

  width: 100%;

  height: auto;

  pointer-events: none;

  user-select: none;

  -webkit-user-drag: none;

}


/* =================================
   マーク本体
================================= */

.mark {

  position: absolute;

  /*
    中心位置を基準にする
  */

  transform: translate3d(
    -50%,
    -50%,
    0
  );

  /*
    display:blockにして
    ブラウザによる自動配置を防ぐ
  */

  display: block;

  /*
    入力した改行を完全に維持
  */

  white-space: pre;

  /*
    自動折り返しを禁止
  */

  overflow: visible;

  /*
    文字位置
  */

  text-align: center;

  /*
    行間固定
  */

  line-height: 1.05;

  /*
    フォント
  */

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans",
    sans-serif;

  font-weight: 900;

  /*
    幅を文字内容に合わせて固定
  */

  width: max-content;

  /*
    高さも文字内容に合わせる
  */

  height: max-content;

  /*
    文字の自動折り返しを防止
  */

  overflow-wrap: normal;

  word-break: normal;

  word-wrap: normal;

  /*
    マーク自体を操作可能にする
  */

  pointer-events: auto;

  touch-action: none;

  user-select: none;

  -webkit-user-select: none;

  /*
    移動中のアニメーションなし
  */

  transition: none;

  /*
    位置だけ変更する
  */

  will-change:
    left,
    top;

  /*
    文字の見やすさ
  */

  text-shadow:
    1px 1px 2px rgba(0,0,0,0.35);

  /*
    カーソル
  */

  cursor: grab;

}


/* =================================
   選択中
================================= */

.mark.selected {

  outline:
    2px dashed #ffff00;

  outline-offset: 4px;

  z-index: 100;

}


/* =================================
   ドラッグ中
================================= */

.mark.dragging {

  cursor: grabbing;

}


/* =================================
   上書き時
================================= */

.mark.overwrite-target {

  outline:
    3px dashed #00ff00;

  outline-offset: 4px;

}


/* =================================
   スマホ
================================= */

@media (max-width: 600px) {


  .toolbar {

    gap: 6px;

    padding: 6px;

  }


  button,
  .fileBtn {

    padding: 8px 10px;

    font-size: 13px;

  }


  .mark-control,
  .color-control,
  .size-control {

    font-size: 12px;

  }


  #markInput {

    width: 110px;

    height: 54px;

    font-size: 18px;

  }


  #markColor {

    width: 40px;

    height: 36px;

  }


  #markSize {

    width: 100px;

    min-width: 100px;

  }


  #selectedInfo {

    min-width: 75px;

    font-size: 11px;

  }


  .help {

    font-size: 12px;

    padding: 6px;

  }

}

</style>

</head>


<body>


<!-- =================================
     操作バー
================================= -->

<div class="toolbar">


  <!-- 画像変更 -->

  <label class="fileBtn">

    🖼️ 画像を変更

    <input
      id="imageFile"
      type="file"
      accept="image/*"
    >

  </label>


  <!-- マーク入力 -->

  <div class="mark-control">

    ✏️ マーク

    <textarea
      id="markInput"
      maxlength="30"
      placeholder="例：⭕️&#10;名前"
    >⭕️</textarea>

  </div>


  <!-- 色 -->

  <div class="color-control">

    🎨 色

    <input
      id="markColor"
      type="color"
      value="#ff0000"
    >

  </div>


  <!-- サイズ -->

  <div class="size-control">

    📏 サイズ

    <input
      type="range"
      id="markSize"
      min="8"
      max="200"
      value="40"
      step="1"
    >

    <span id="sizeValue">
      40px
    </span>

  </div>


  <!-- 選択中 -->

  <div id="selectedInfo">

    未選択

  </div>


  <!-- 消しゴム -->

  <button id="eraseMode">

    🧹 消しゴム

  </button>


  <!-- 1つ戻す -->

  <button id="undo">

    ↩ 1つ戻す

  </button>


  <!-- 全部消す -->

  <button id="clear">

    🗑️ 全部消す

  </button>


</div>


<!-- =================================
     操作説明
================================= -->

<div class="help">

  画像をタップ → マーク追加　
  ｜　
  マークをタップ → 選択　
  ｜　
  ドラッグ → 移動　
  ｜　
  サイズバー → 選択中だけ拡大・縮小

</div>


<!-- =================================
     画像
================================= -->

<div id="board">

  <img
    id="base"
    src="https://picsum.photos/800/1000"
    alt="タップしてマークを付ける画像"
  >

</div>



<script>


/* =================================
   要素取得
================================= */

const board =
  document.getElementById("board");

const base =
  document.getElementById("base");

const imageFile =
  document.getElementById("imageFile");

const markInput =
  document.getElementById("markInput");

const markColor =
  document.getElementById("markColor");

const markSize =
  document.getElementById("markSize");

const sizeValue =
  document.getElementById("sizeValue");

const selectedInfo =
  document.getElementById("selectedInfo");

const eraseMode =
  document.getElementById("eraseMode");

const undo =
  document.getElementById("undo");

const clear =
  document.getElementById("clear");


/* =================================
   マーク一覧
================================= */

let marks = [];


/* =================================
   選択中マーク
================================= */

let selectedMark = null;


/* =================================
   消しゴムモード
================================= */

let isEraseMode = false;


/* =================================
   入力文字取得
================================= */

function getMarkText() {

  let text =
    markInput.value;


  if (
    text.trim() === ""
  ) {

    text = "⭕️";

  }


  return text;

}


/* =================================
   マーク選択
================================= */

function selectMark(mark) {


  /*
    すべての選択状態を解除
  */

  marks.forEach(
    function(item) {

      item.classList.remove(
        "selected"
      );

    }
  );


  selectedMark = mark;


  if (mark) {


    mark.classList.add(
      "selected"
    );


    /*
      そのマークのサイズを
      バーに反映
    */

    const size =
      Number(
        mark.dataset.size
      );


    markSize.value =
      size;


    sizeValue.textContent =
      Math.round(size) + "px";


    selectedInfo.textContent =
      "選択中";

  }
  else {

    selectedInfo.textContent =
      "未選択";

  }

}


/* =================================
   マーク作成
================================= */

function createMark(
  x,
  y
) {


  const mark =
    document.createElement(
      "div"
    );


  mark.className =
    "mark";


  /*
    入力文字

    改行もそのまま保存
  */

  mark.textContent =
    getMarkText();


  /*
    位置
  */

  mark.style.left =
    x + "px";

  mark.style.top =
    y + "px";


  /*
    新規サイズ
  */

  const initialSize =
    Number(
      markSize.value
    );


  mark.style.fontSize =
    initialSize + "px";


  /*
    サイズを保存
  */

  mark.dataset.size =
    initialSize;


  /*
    座標を保存
  */

  mark.dataset.x =
    x;

  mark.dataset.y =
    y;


  /*
    色
  */

  mark.style.color =
    markColor.value;


  /*
    移動状態
  */

  let pointerId = null;

  let dragging = false;

  let moved = false;

  let startPointerX = 0;

  let startPointerY = 0;

  let startMarkX = x;

  let startMarkY = y;


  /* =================================
     pointerdown
  ================================= */

  mark.addEventListener(
    "pointerdown",
    function(e) {


      e.preventDefault();

      e.stopPropagation();


      /*
        消しゴム
      */

      if (isEraseMode) {

        removeMark(mark);

        return;

      }


      /*
        選択
      */

      selectMark(mark);


      /*
        ポインター情報
      */

      pointerId =
        e.pointerId;


      startPointerX =
        e.clientX;

      startPointerY =
        e.clientY;


      startMarkX =
        Number(
          mark.dataset.x
        );

      startMarkY =
        Number(
          mark.dataset.y
        );


      dragging = false;

      moved = false;


      try {

        mark.setPointerCapture(
          e.pointerId
        );

      }
      catch(error) {}

    }
  );


  /* =================================
     pointermove
  ================================= */

  mark.addEventListener(
    "pointermove",
    function(e) {


      if (
        pointerId !==
        e.pointerId
      ) {

        return;

      }


      e.preventDefault();

      e.stopPropagation();


      const dx =
        e.clientX -
        startPointerX;


      const dy =
        e.clientY -
        startPointerY;


      /*
        3px以上動いたら
        ドラッグと判断
      */

      if (
        Math.abs(dx) > 3 ||
        Math.abs(dy) > 3
      ) {

        dragging = true;

        moved = true;

        mark.classList.add(
          "dragging"
        );

      }


      if (!dragging) {

        return;

      }


      const rect =
        board.getBoundingClientRect();


      /*
        移動先

        サイズ・文字内容には
        一切触れない
      */

      let newX =
        startMarkX + dx;


      let newY =
        startMarkY + dy;


      /*
        ボード内に収める
      */

      newX =
        Math.max(
          0,
          Math.min(
            rect.width,
            newX
          )
        );


      newY =
        Math.max(
          0,
          Math.min(
            rect.height,
            newY
          )
        );


      /*
        位置だけ変更

        ★重要★

        fontSizeを変更しない

        textContentを変更しない

        widthを変更しない

        heightを変更しない
      */

      mark.style.left =
        newX + "px";

      mark.style.top =
        newY + "px";


      mark.dataset.x =
        newX;

      mark.dataset.y =
        newY;

    }
  );


  /* =================================
     pointerup
  ================================= */

  mark.addEventListener(
    "pointerup",
    function(e) {


      if (
        pointerId !==
        e.pointerId
      ) {

        return;

      }


      e.preventDefault();

      e.stopPropagation();


      mark.classList.remove(
        "dragging"
      );


      /*
        移動していない場合

        → 上書き
      */

      if (!moved) {

        overwriteMark(mark);

      }


      dragging = false;

      moved = false;

      pointerId = null;

    }
  );


  /* =================================
     pointercancel
  ================================= */

  mark.addEventListener(
    "pointercancel",
    function() {

      dragging = false;

      moved = false;

      pointerId = null;

      mark.classList.remove(
        "dragging"
      );

    }
  );


  /*
    ボードに追加
  */

  board.appendChild(mark);


  marks.push(mark);


  /*
    作ったマークを選択
  */

  selectMark(mark);

}


/* =================================
   マーク追加
================================= */

function addMark(
  clientX,
  clientY
) {


  const rect =
    board.getBoundingClientRect();


  const x =
    clientX -
    rect.left;


  const y =
    clientY -
    rect.top;


  createMark(
    x,
    y
  );

}


/* =================================
   マーク上書き
================================= */

function overwriteMark(mark) {


  /*
    現在のサイズを保存
  */

  const currentSize =
    Number(
      mark.dataset.size
    );


  /*
    新しい文字に変更

    改行もそのまま
  */

  mark.textContent =
    getMarkText();


  /*
    色変更
  */

  mark.style.color =
    markColor.value;


  /*
    サイズ維持
  */

  mark.style.fontSize =
    currentSize + "px";


  /*
    上書きしたことを表示
  */

  mark.classList.add(
    "overwrite-target"
  );


  setTimeout(
    function() {

      mark.classList.remove(
        "overwrite-target"
      );

    },
    300
  );

}


/* =================================
   サイズ変更
================================= */

markSize.addEventListener(
  "input",
  function() {


    const size =
      Number(this.value);


    sizeValue.textContent =
      size + "px";


    /*
      選択中のマークだけ変更
    */

    if (selectedMark) {


      selectedMark.style.fontSize =
        size + "px";


      selectedMark.dataset.size =
        size;


      return;

    }


    /*
      未選択なら
      新しく書くマークのサイズ
    */

  }
);


/* =================================
   色変更
================================= */

markColor.addEventListener(
  "input",
  function() {


    /*
      選択中のマークだけ変更
    */

    if (selectedMark) {

      selectedMark.style.color =
        this.value;

      return;

    }

  }
);


/* =================================
   画像タップ
================================= */

board.addEventListener(
  "pointerup",
  function(e) {


    /*
      マークをタップした場合
      ここでは新規作成しない
    */

    if (
      e.target.classList.contains(
        "mark"
      )
    ) {

      return;

    }


    /*
      画像以外は無視
    */

    if (
      e.target !== board &&
      e.target !== base
    ) {

      return;

    }


    /*
      消しゴム中
    */

    if (isEraseMode) {

      return;

    }


    /*
      新しいマークを追加
    */

    addMark(
      e.clientX,
      e.clientY
    );

  }
);


/* =================================
   消しゴム
================================= */

eraseMode.addEventListener(
  "click",
  function() {


    isEraseMode =
      !isEraseMode;


    if (isEraseMode) {


      eraseMode.textContent =
        "🧹 消しゴムON";


      eraseMode.classList.add(
        "active"
      );


      selectMark(null);


    }
    else {


      eraseMode.textContent =
        "🧹 消しゴム";


      eraseMode.classList.remove(
        "active"
      );

    }

  }
);


/* =================================
   マーク削除
================================= */

function removeMark(mark) {


  const index =
    marks.indexOf(mark);


  if (index !== -1) {

    marks.splice(
      index,
      1
    );

  }


  if (
    selectedMark === mark
  ) {

    selectedMark = null;

    selectedInfo.textContent =
      "未選択";

  }


  mark.remove();

}


/* =================================
   画像変更
================================= */

imageFile.addEventListener(
  "change",
  function(e) {


    const file =
      e.target.files[0];


    if (!file) {

      return;

    }


    const url =
      URL.createObjectURL(file);


    base.onload =
      function() {

        URL.revokeObjectURL(url);

      };


    base.src =
      url;


    /*
      画像を変更したら
      マークを全部削除
    */

    marks.forEach(
      function(mark) {

        mark.remove();

      }
    );


    marks = [];

    selectedMark = null;

    selectedInfo.textContent =
      "未選択";

  }
);


/* =================================
   1つ戻す
================================= */

undo.addEventListener(
  "click",
  function() {


    const mark =
      marks.pop();


    if (!mark) {

      return;

    }


    if (
      selectedMark === mark
    ) {

      selectedMark = null;

    }


    mark.remove();


    /*
      一つ前のマークを
      選択状態にする
    */

    if (
      marks.length > 0
    ) {

      selectMark(
        marks[
          marks.length - 1
        ]
      );

    }
    else {

      selectedInfo.textContent =
        "未選択";

    }

  }
);


/* =================================
   全部消す
================================= */

clear.addEventListener(
  "click",
  function() {


    marks.forEach(
      function(mark) {

        mark.remove();

      }
    );


    marks = [];

    selectedMark = null;


    selectedInfo.textContent =
      "未選択";

  }
);


</script>

</body>

</html>
